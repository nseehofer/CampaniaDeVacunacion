<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campaña de Vacunación Provincial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../estilos/reservaTurno.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
    <header class="py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <h4 class="m-0">Vacunate Provincia</h4>
            <nav class="d-flex align-items-center">
                <a href="../index.html" class="text-white text-decoration-none me-3">Inicio</a>
                <a href="#" class="text-white text-decoration-none d-flex align-items-center">
                    <i class="bi bi-person-circle fs-4 me-2"></i>
                    <span class="d-none d-sm-inline">Mario Luis</span>
                </a>
            </nav>
        </div>
    </header>


    <main class="content d-flex justify-content-center align-items-center " style="min-height: 60vh;">
        <section class="hero w-100 ">
            <div class="container d-flex flex-column align-items-center py-4 borde-sombreado ">
                <h2 class="text-center mb-2">Reservá tu turno de vacunación: <span class="nombre-usuario">Mario
                        Luis</span></h2>
                <form class="d-flex flex-column gap-5 mt-5">

                    <div class="mb-3">
                        <label class="form-label d-block mb-2 fs-5 letra-negrita">Tipo de vacuna</label>
                        <div class="btn-group d-flex flex-wrap gap-5" role="group" aria-label="Tipo de vacuna">

                            <input type="radio" class="btn-check" name="tipoVacuna" id="covid" autocomplete="off">
                            <label
                                class="btn btn-outline-danger m-1 flex-fill d-flex align-items-center py-2 fit-content cursor-pointer"
                                for="covid" style="border-radius: 0.2rem;">
                                <img src="../img/jeringa.png" alt="Jeringa COVID" class="me-3 img-fluid"
                                    style="max-height: 40px;">
                                <span class="fs-5">COVID-19</span>
                            </label>

                            <input type="radio" class="btn-check" name="tipoVacuna" id="gripe" autocomplete="off">
                            <label
                                class="btn btn-outline-success m-1 flex-fill d-flex align-items-center py-2 fit-content"
                                for="gripe" style="border-radius: 0.2rem;">
                                <img src="../img/jeringa.png" alt="Jeringa Gripe" class="me-3 img-fluid"
                                    style="max-height: 40px;">
                                <span>Gripe</span>
                            </label>

                            <input type="radio" class="btn-check" name="tipoVacuna" id="fiebreAmarilla"
                                autocomplete="off">
                            <label
                                class="btn btn-outline-warning  m-1 flex-fill d-flex align-items-center py-2 fit-content"
                                for="fiebreAmarilla" style="border-radius: 0.2rem;">
                                <img src="../img/jeringa.png" alt="Jeringa Fiebre amarilla" class="me-3 img-fluid"
                                    style="max-height: 40px;">
                                <span>Fiebre amarilla</span>
                            </label>

                        </div>
                    </div>


                    <div class="mb-3">
                        <label class="form-label d-block mb-2 fs-5 letra-negrita">Centro de vacunación</label>
                        <div class="btn-group d-flex flex-wrap" role="group" aria-label="Centro de vacunación">
                            <input type="radio" class="btn-check " name="centroVacunacion" id="sanJusto"
                                autocomplete="off">
                            <label
                                class="btn btn-outline-success m-1 flex-fill text-center borde-negro fit-content select-vacunacion "
                                for="sanJusto" style="border-radius: 0.2rem;">Ctro
                                Vacunacion San
                                Justo</label>

                            <input type="radio" class="btn-check " name="centroVacunacion" id="laTablada"
                                autocomplete="off">
                            <label
                                class="btn btn-outline-success m-1 flex-fill text-center borde-negro fit-content select-vacunacion "
                                for="laTablada" style="border-radius: 0.2rem;">Ctro
                                Vacunacion La
                                Tablada</label>

                            <input type="radio" class="btn-check" name="centroVacunacion" id="ramosMejia"
                                autocomplete="off">
                            <label
                                class="btn btn-outline-success m-1 flex-fill text-center borde-negro fit-content select-vacunacion "
                                for="ramosMejia" style="border-radius: 0.2rem;">Ctro
                                Vacunacion Ramos
                                Mejía</label>

                            <input type="radio" class="btn-check" name="centroVacunacion" id="gonzalezCatan"
                                autocomplete="off">
                            <label
                                class="btn btn-outline-success m-1 flex-fill text-center borde-negro fit-content select-vacunacion "
                                for="gonzalezCatan" style="border-radius: 0.2rem;">Ctro
                                Vacunacion González Catán</label>
                        </div>
                    </div>

                    <div class="row">
                        <div class="media-query d-flex col-md-6 mb-2">
                            <div class="col-md-6 mb-3">
                                <label for="mes" class="form-label fs-5 letra-negrita">Mes de vacunación</label>
                                <select class="form-select border border-dark fit-content cursor-pointer" id="mes">
                                </select>
                                <small class="text-muted">Desde hoy hasta 3 meses en adelante</small>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label for="semana" class="form-label fs-5 letra-negrita">Semana dentro del mes</label>
                                <select class="form-select border border-dark fit-content cursor-pointer" id="semana">
                                    <option selected disabled>Seleccioná una semana</option>
                                </select>

                            </div>

                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label d-block mb-2 fs-5 letra-negrita">Franja horaria</label>
                            <div class="btn-group d-flex flex-wrap" role="group" aria-label="Franja horaria">
                                <input type="radio" class="btn-check" name="franjaHoraria" id="manana"
                                    autocomplete="off">
                                <label class="btn btn-outline-success m-1 flex-fill text-center fit-content borde-negro"
                                    for="manana" style="border-radius: 0.2rem;">Mañana</label>

                                <input type="radio" class="btn-check" name="franjaHoraria" id="mediaManana"
                                    autocomplete="off">
                                <label class="btn btn-outline-success m-1 flex-fill text-center fit-content borde-negro"
                                    for="mediaManana" style="border-radius: 0.2rem;">Media-mañana</label>

                                <input type="radio" class="btn-check" name="franjaHoraria" id="mediodia"
                                    autocomplete="off">
                                <label class="btn btn-outline-success m-1 flex-fill text-center fit-content borde-negro"
                                    for="mediodia" style="border-radius: 0.2rem;">Mediodía</label>

                                <input type="radio" class="btn-check" name="franjaHoraria" id="mediaTarde"
                                    autocomplete="off">
                                <label class="btn btn-outline-success m-1 flex-fill text-center fit-content borde-negro"
                                    for="mediaTarde" style="border-radius: 0.2rem;">Media-tarde</label>

                                <input type="radio" class="btn-check" name="franjaHoraria" id="tarde"
                                    autocomplete="off">
                                <label class="btn btn-outline-success m-1 flex-fill text-center fit-content borde-negro"
                                    for="tarde" style="border-radius: 0.2rem;">Tarde</label>

                                <input type="radio" class="btn-check" name="franjaHoraria" id="tardeNoche"
                                    autocomplete="off">
                                <label class="btn btn-outline-success m-1 flex-fill text-center fit-content borde-negro"
                                    for="tardeNoche" style="border-radius: 0.2rem;">Tarde-noche</label>
                            </div>
                        </div>

                    </div>

                    <a href="../paginas/paginaQueHizoLu.html"
                        class="btn btn-primary mt-3 d-flex justify-content-center ms-auto">
                        Confirmar turno
                    </a>

                </form>
            </div>
        </section>
    </main>


    <footer>
        <div class="container">
            <p class="mb-0">© 2025 Gobierno de la Provincia. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const mesSelect = document.getElementById("mes");
        const semanaSelect = document.getElementById("semana");

        const today = new Date();
        const maxDate = new Date();
        maxDate.setMonth(today.getMonth() + 3);
        const semanasPorMes = {};

        let current = new Date(today);

        while (current <= maxDate) {
            const startOfWeek = new Date(current);
            startOfWeek.setDate(current.getDate() - current.getDay() + 1);
            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(startOfWeek.getDate() + 6);

            const monthLabel = startOfWeek.toLocaleString('es-ES', { month: 'long', year: 'numeric' });
            const weekLabel = `${startOfWeek.getDate()}–${endOfWeek.getDate()} de ${monthLabel}`;
            const isoDate = startOfWeek.toISOString().split("T")[0];

            if (!semanasPorMes[monthLabel]) semanasPorMes[monthLabel] = [];
            semanasPorMes[monthLabel].push({ text: weekLabel, value: isoDate });

            current.setDate(current.getDate() + 7);
        }

        Object.keys(semanasPorMes).forEach(mes => {
            const option = document.createElement("option");
            option.value = mes;
            option.textContent = mes.charAt(0).toUpperCase() + mes.slice(1);
            mesSelect.appendChild(option);
        });


        mesSelect.addEventListener("change", function () {
            const elegido = this.value;
            semanaSelect.innerHTML = `<option selected disabled>Seleccioná una semana</option>`;
            semanasPorMes[elegido].forEach(semana => {
                const option = document.createElement("option");
                option.value = semana.value;
                option.textContent = semana.text;
                semanaSelect.appendChild(option);
            });
        });

        const domMesSelect = document.getElementById("mes");
        const domSemanaSelect = document.getElementById("semana");


        function pintarSiSeleccionado(selectElement) {
            const seleccionado = selectElement.value;
            if (seleccionado) {
                selectElement.style.backgroundColor = "green";
            }
        }


        domMesSelect.addEventListener("change", function () {
            pintarSiSeleccionado(domMesSelect);
        });

        domSemanaSelect.addEventListener("change", function () {
            pintarSiSeleccionado(domSemanaSelect);
        });



    </script>
</body>

</html>
