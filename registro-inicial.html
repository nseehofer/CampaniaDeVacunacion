<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campaña de Vacunación Provincial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="./estilos/indice.css" rel="stylesheet" />
</head>

<body>
    <header class="py-3">
        <div class="container d-flex justify-content-between align-items-center">
            <h4 class="m-0">Vacunate Provincia</h4>
            <nav>

                <a href="index.html" class="text-white text-decoration-none me-3">Inicio</a>
                <a href="#" class="text-white text-decoration-none me-3">Centros</a>
                <a href="#" class="text-white text-decoration-none">Contacto</a>
            </nav>
        </div>
    </header>

    <main class="content d-flex justify-content-center align-items-center" style="min-height: 60vh;">
        <section class="datos-personales">
            <h2>Registro</h2>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item fw-bold">1) Datos personales</li>
                    <li class="breadcrumb-item " aria-current="page">2) Datos de contacto</li>
                </ol>
            </nav>            
            <form action="datos-contacto.html">
                <div class="mb-3 text-start">
                <label for="nombre" class="form-label fw-bold">Nombre completo</label>
                <input type="text" class="form-control" id="nombre" placeholder="Ingrese su nombre completo">
                </div>

                <div class="mb-3 text-start">
                <label for="dni" class="form-label fw-bold">Dni</label>
                <input type="text" class="form-control" id="dni" placeholder="Ej: 32123456">
                </div>

                <div class="mb-3 text-start">
                <label for="fechaNacimiento" class="form-label fw-bold">Fecha de nacimiento</label>
                <input type="date" class="form-control" id="fechaNacimiento" placeholder="Seleccione su fecha de nacimiento">
                </div>

                <div class="mb-3 text-start">
                    <input type="radio" class="btn-check" name="options" id="option1" autocomplete="off" >
                    <label class="btn btn-outline-primary" for="option1">Masculino</label>

                    <input type="radio" class="btn-check" name="options" id="option2" autocomplete="off">
                    <label class="btn btn-outline-primary" for="option2">Femenino</label>

                    <input type="radio" class="btn-check" name="options" id="option3" autocomplete="off" >
                    <label class="btn btn-outline-primary" for="option3">Otro</label>
                </div>                
                
                <button type="submit" class="btn btn-primary mt-3 submit">Continuar</button>
                
            </form>
        </section>
    </main>
    <footer>
        <div class="container">
            <p class="mb-0">© 2025 Gobierno de la Provincia. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
