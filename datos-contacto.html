<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Campaña de Vacunación Provincial</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link href="./estilos/indice.css" rel="stylesheet" />
    </head>

    <body>
        <header class="py-3">
            <div class="container d-flex justify-content-between align-items-center">
                <h4 class="m-0">Vacunate Provincia</h4>
                <nav>
                    <a href="index.html" class="text-white text-decoration-none me-3">Inicio</a>
                    <a href="#" class="text-white text-decoration-none me-3">Centros</a>
                    <a href="#" class="text-white text-decoration-none">Contacto</a>
                </nav>
            </div>
        </header>

        <main
            class="content d-flex justify-content-center align-items-center"
            style="min-height: 60vh"
        >
            <section class="datos-contacto">
                <h2>Registro</h2>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item">1) Datos personales</li>
                        <li class="breadcrumb-item fw-bold" aria-current="page">
                            2) Datos de contacto
                        </li>
                    </ol>
                </nav>
                <form action="./paginas/registro-completado.html">
                    <div class="mb-3 text-start">
                        <label for="telefono" class="form-label fw-bold">Teléfono</label>
                        <input
                            type="tel"
                            class="form-control"
                            id="telefono"
                            placeholder="Ingrese su teléfono"
                        />
                    </div>

                    <div class="mb-3 text-start">
                        <label for="email" class="form-label fw-bold">Email</label>
                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            placeholder="Ingrese su email"
                        />
                    </div>

                    <div class="mb-3 text-start">
                        <label for="password" class="form-label fw-bold">Contraseña</label>
                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            placeholder="Ingrese su contraseña"
                        />
                    </div>

                    <div class="mb-3 text-start">
                        <label for="passwordconfirm" class="form-label fw-bold"
                            >Repita su Contraseña</label
                        >
                        <input
                            type="password"
                            class="form-control"
                            id="passwordconfirm"
                            placeholder="Ingrese nuevamente su contraseña"
                        />
                    </div>

                    <button type="submit" class="btn btn-primary mt-3 submit">Continuar</button>
                </form>
            </section>
        </main>
        <footer>
            <div class="container">
                <p class="mb-0">© 2025 Gobierno de la Provincia. Todos los derechos reservados.</p>
            </div>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
